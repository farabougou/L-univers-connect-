services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: paios
      POSTGRES_PASSWORD: paios_dev_password
      POSTGRES_DB: paios
    ports:
      - "5432:5432"
    volumes:
      - paios_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paios -d paios"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  paios_db_data:
