services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      # "postgres" reste le compte d'administration utilisé uniquement à
      # l'initialisation (voir init-db/01-create-app-role.sql). L'API se
      # connecte avec le rôle applicatif "paios", non superutilisateur, pour
      # que la sécurité RLS s'applique réellement.
      POSTGRES_PASSWORD: postgres_admin_dev_password
      POSTGRES_DB: paios
    ports:
      - "5432:5432"
    volumes:
      - paios_db_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d paios"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      # Compte admin de la console Keycloak (http://localhost:8080/admin).
      # Développement local uniquement, jamais utilisé en production.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_dev_password
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

volumes:
  paios_db_data:
