name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paios
          POSTGRES_PASSWORD: paios_dev_password
          POSTGRES_DB: paios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paios -d paios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://paios:paios_dev_password@localhost:5432/paios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Migrer la base de données (Alembic)
        run: alembic upgrade head

      - name: Tests (pytest)
        run: pytest
