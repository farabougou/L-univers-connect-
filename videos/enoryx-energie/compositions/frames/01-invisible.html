<template>
  <style>

@font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }

@font-face { font-family: "IBM Plex Mono"; font-weight: 500; src: url("assets/fonts/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); }

    #root { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; font-family: "Inter", sans-serif; color: #FFFFFF; }

    #k01-bg { position: absolute; inset: 0; background: radial-gradient(110% 60% at 50% 40%, #0c1a3a 0%, #050B1A 65%); }
    .k01-kick { position: absolute; left: 0; right: 0; text-align: center; font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 30px; letter-spacing: 0.16em; color: #38BDF8; }
    .k01-h { position: absolute; left: 30px; right: 30px; text-align: center; font-weight: 900; letter-spacing: -0.04em; line-height: 1; color: #F8FAFC; white-space: nowrap; }
    .k01-h em { font-style: normal; color: #38BDF8; }
    .k01-card { position: absolute; border-radius: 40px; background: rgba(12,23,48,0.92); border: 2px solid #1E2A44; }
    .k01-mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; letter-spacing: 0.12em; }

    #k01-moon { position: absolute; left: 800px; top: 330px; width: 110px; height: 110px; border-radius: 55px; background: #dbe7ff; box-shadow: 0 0 60px rgba(219,231,255,0.35); }
    #k01-moon i { position: absolute; left: 30px; top: -12px; width: 110px; height: 110px; border-radius: 55px; background: #08122a; }

    #k01-meter { left: 140px; right: 140px; top: 1360px; height: 180px; display: flex; align-items: center; padding: 0 44px; gap: 30px; }
    #k01-meter .lab { display: flex; flex-direction: column; gap: 8px; }
    #k01-meter .lab span { display: block; font-size: 24px; color: #94A3B8; }
    #k01-meter .lab b { display: block; font-size: 30px; color: #F8FAFC; font-weight: 700; }

  </style>
  <div id="root" data-composition-id="01-invisible" data-start="0" data-duration="6.57" data-width="1080" data-height="1920">

    <div id="k01-bg" class="clip" data-start="0" data-duration="6.57" data-track-index="0"></div>
    <div class="k01-kick" id="k01-k1">02:00 · BUREAUX VIDES</div>
    <div class="k01-h" id="k01-hero">invisible<em>.</em></div>
    <div id="k01-moon"><i></i></div>
    <svg id="k01-heat" viewBox="0 0 700 300"></svg>
    <svg id="k01-bld" viewBox="0 0 700 820"></svg>
    <div class="k01-card" id="k01-meter">
      <div class="lab"><span class="k01-mono">CONSOMMATION</span><b>chauffage · nuit</b></div>

  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const R = (s) => document.querySelector('[data-composition-id="01-invisible"] ' + s);
      const RA = (s) => document.querySelectorAll('[data-composition-id="01-invisible"] ' + s);

      const NS = "http://www.w3.org/2000/svg";
      const bld = R("#k01-bld"), heat = R("#k01-heat");
      const el = (p, tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
      el(bld, "rect", { x: 40, y: 0, width: 620, height: 820, rx: 18, fill: "#0b1630", stroke: "#1E2A44", "stroke-width": 4 });
      el(bld, "rect", { x: 260, y: 700, width: 180, height: 120, fill: "#08122a", stroke: "#1E2A44", "stroke-width": 4 });
      const wins = [];
      for (let r = 0; r < 7; r++) for (let c = 0; c < 5; c++) {
        if (r === 6 && (c === 2)) continue;
        wins.push(el(bld, "rect", { x: 80 + c * 112, y: 40 + r * 95, width: 76, height: 60, rx: 8, fill: "#111f3d" }));
      }
      const waves = [];
      for (let i = 0; i < 5; i++) {
        const x = 110 + i * 120;
        waves.push(el(heat, "path", { d: `M${x} 290 C ${x - 30} 240, ${x + 30} 200, ${x} 150 S ${x - 30} 60, ${x} 10`, fill: "none", stroke: "#EA580C", "stroke-width": 8, "stroke-linecap": "round", opacity: 0 }));
      }
      gsap.set(R("#k01-hero"), { opacity: 0 });
      tl.fromTo(R("#k01-k1"), { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo(bld, { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0);
      tl.fromTo(R("#k01-moon"), { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.8, ease: "power3.out" }, 0.15);
      // "chauffage tourne encore" → windows glow warm, heat rises, meter spins
      wins.forEach((w, i) => tl.to(w, { fill: i % 3 === 0 ? "#5a2a12" : "#3a1d10", duration: 0.5, ease: "sine.out" }, 0.7 + (i % 7) * 0.05));
      waves.forEach((w, i) => {
        tl.fromTo(w, { opacity: 0, y: 40 }, { opacity: 0.85, y: 0, duration: 0.6, ease: "power2.out" }, 0.9 + i * 0.1);
        tl.to(w, { y: -40, opacity: 0.25, duration: 1.4, repeat: 2, yoyo: true, ease: "sine.inOut" }, 1.5 + i * 0.1);
      });
      tl.fromTo(R("#k01-meter"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 1.1);
      const c = { v: 0 };
      tl.fromTo(c, { v: 0 }, { v: 1840, duration: 4.6, ease: "none", onUpdate: () => { R("#k01-num").textContent = Math.round(c.v).toLocaleString("fr-FR"); } }, 1.3);
      // "invisible" — the kicker gives way to the hero word; the building dims
      tl.to(R("#k01-k1"), { opacity: 0, duration: 0.25 }, 3.9);
      tl.fromTo(R("#k01-hero"), { opacity: 0, scale: 1.3, filter: "blur(14px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.55, ease: "power4.out", immediateRender: false }, 4.1);
      tl.to(heat, { opacity: 0.35, duration: 0.8 }, 4.3);

      window.__timelines["01-invisible"] = tl;
    })();
  </script>
