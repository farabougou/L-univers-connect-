<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #140D08; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #140D08; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="34" data-width="1080" data-height="1920" data-fps="25">
      <div id="el-01-intro" class="scene" data-composition-id="01-intro" data-composition-src="compositions/frames/01-intro.html" data-start="0" data-duration="5.1" data-track-index="0"></div>
      <div id="el-02-heritage" class="scene" data-composition-id="02-heritage" data-composition-src="compositions/frames/02-heritage.html" data-start="4.6" data-duration="5.3" data-track-index="1"></div>
      <div id="el-03-chemises" class="scene" data-composition-id="03-chemises" data-composition-src="compositions/frames/03-chemises.html" data-start="9.4" data-duration="6.7" data-track-index="0"></div>
      <div id="el-04-vestes" class="scene" data-composition-id="04-vestes" data-composition-src="compositions/frames/04-vestes.html" data-start="15.6" data-duration="5.3" data-track-index="1"></div>
      <div id="el-05-robe" class="scene" data-composition-id="05-robe" data-composition-src="compositions/frames/05-robe.html" data-start="20.4" data-duration="5.5" data-track-index="0"></div>
      <div id="el-06-mosaique" class="scene" data-composition-id="06-mosaique" data-composition-src="compositions/frames/06-mosaique.html" data-start="25.4" data-duration="4.3" data-track-index="1"></div>
      <div id="el-07-contact" class="scene" data-composition-id="07-contact" data-composition-src="compositions/frames/07-contact.html" data-start="29.2" data-duration="4.8" data-track-index="0"></div>

      <audio id="el-bgm" src="assets/music.wav" data-start="0" data-duration="34" data-track-index="11" data-volume="0.75"></audio>
<!--VO-->
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () { var tl = window.__timelines["main"];
        tl.fromTo("#el-02-heritage", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4.6);
        tl.fromTo("#el-03-chemises", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 9.4);
        tl.fromTo("#el-04-vestes", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 15.6);
        tl.fromTo("#el-05-robe", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 20.4);
        tl.fromTo("#el-06-mosaique", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 25.4);
        tl.fromTo("#el-07-contact", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 29.2);
        tl.to({}, { duration: 34 }, 0);
      })();
    </script>
  </body>
</html>
