<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #06111F; }
      .scene { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="60" data-width="1920" data-height="1080">
      <div id="el-01-trajet" class="scene" data-composition-id="01-trajet" data-composition-src="compositions/frames/01-trajet.html" data-start="0" data-duration="7.5" data-track-index="0"></div>
      <div id="el-02-reperes" class="scene" data-composition-id="02-reperes" data-composition-src="compositions/frames/02-reperes.html" data-start="7" data-duration="9.5" data-track-index="1"></div>
      <div id="el-03-offre" class="scene" data-composition-id="03-offre" data-composition-src="compositions/frames/03-offre.html" data-start="16" data-duration="11.5" data-track-index="0"></div>
      <div id="el-04-information" class="scene" data-composition-id="04-information" data-composition-src="compositions/frames/04-information.html" data-start="27" data-duration="11.5" data-track-index="1"></div>
      <div id="el-05-action" class="scene" data-composition-id="05-action" data-composition-src="compositions/frames/05-action.html" data-start="38" data-duration="12.5" data-track-index="0"></div>
      <div id="el-06-adresse" class="scene" data-composition-id="06-adresse" data-composition-src="compositions/frames/06-adresse.html" data-start="50" data-duration="10" data-track-index="1"></div>

      <audio id="el-bgm" src="assets/music.wav" data-start="0" data-duration="60" data-track-index="11" data-volume="0.55"></audio>
      <audio id="el-click0" src="assets/click.wav" data-start="30.1" data-duration="0.2" data-track-index="12" data-volume="0.5"></audio>
      <audio id="el-click1" src="assets/click.wav" data-start="33.9" data-duration="0.2" data-track-index="13" data-volume="0.5"></audio>
      <audio id="el-click2" src="assets/click.wav" data-start="42.65" data-duration="0.2" data-track-index="14" data-volume="0.5"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () { var tl = window.__timelines["main"];
        tl.fromTo("#el-02-reperes", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 7);
        tl.fromTo("#el-03-offre", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power3.inOut" }, 15.8);
        tl.fromTo("#el-04-information", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 27);
        tl.fromTo("#el-05-action", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 38);
        tl.fromTo("#el-06-adresse", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 50);
        tl.to({}, { duration: 60 }, 0);
      })();
    </script>
  </body>
</html>
